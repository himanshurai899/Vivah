<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
  <title id="title">Vivah</title>
  <desc id="desc">Vivah brand mark with elegant S and H serif monogram.</desc>
  <defs>
    <linearGradient id="goldLogo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4ad6e"/>
      <stop offset="100%" stop-color="#a88860"/>
    </linearGradient>
  </defs>
  <!-- Cream background -->
  <rect width="720" height="220" rx="24" fill="#fbf6f0"/>
  
  <!-- Rounded monogram mark -->
  <g transform="translate(32, 18)">
    <rect x="0" y="0" width="176" height="176" rx="42" fill="#8b7d6b"/>
    <g transform="translate(88, 88)" text-anchor="middle" dominant-baseline="central">
      <text x="-24" y="0" font-family="Didot, 'Times New Roman', serif" font-size="130" font-weight="300" fill="url(#goldLogo)">S</text>
      <text x="24" y="0" font-family="Didot, 'Times New Roman', serif" font-size="130" font-weight="300" fill="url(#goldLogo)">H</text>
    </g>
  </g>
  
  <!-- Vivah wordmark -->
  <text x="260" y="115" fill="#6f1f2a" font-family="Playfair Display, Georgia, serif" font-size="72" font-weight="700">Vivah</text>
  
  <!-- Subtitle -->
  <text x="260" y="165" fill="#8b7d6b" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="2.5">WEDDING OS</text>
</svg>
