<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
  <title id="title">Vivah logo</title>
  <desc id="desc">Modern wedding planning logo with S and H initials in a bold red and black mark.</desc>
  <defs>
    <linearGradient id="red" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ff1b2d"/>
      <stop offset="100%" stop-color="#b80023"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="720" height="220" rx="28" fill="#0d0d0d"/>
  <g transform="translate(40 30)">
    <rect x="0" y="0" width="160" height="160" rx="36" fill="#121212"/>
    <text x="80" y="112" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="80" font-weight="900" fill="url(#red)">SH</text>
    <rect x="0" y="0" width="160" height="160" rx="36" fill="url(#shine)" opacity="0.16"/>
  </g>
  <text x="260" y="100" fill="#fff" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="800">Vivah</text>
  <text x="260" y="150" fill="#ddd" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="2.5">WEDDING OS</text>
</svg>
