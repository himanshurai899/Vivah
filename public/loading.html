<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vivah — Loading</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@400;500&display=swap" />
  <style>
    /* ── Agni-Jal tokens ── */
    :root {
      --ink:    #0F0612;
      --purple: #7C3AED;
      --gold:   #C9A84C;
      --ivory:  #FAFAF8;
      --saffron:#E2813F;
      --gold-l: #E8C56A;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--ivory);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', system-ui, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* ── Rangoli dot background ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle, rgba(201,168,76,0.10) 1.5px, transparent 1.5px),
        radial-gradient(circle, rgba(124,58,237,0.06) 1.5px, transparent 1.5px);
      background-size: 40px 40px, 40px 40px;
      background-position: 0 0, 20px 20px;
      pointer-events: none;
    }

    /* ── Dual aurora glow ── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 40% 50%, rgba(124,58,237,0.10) 0%, transparent 65%),
        radial-gradient(ellipse 50% 40% at 65% 55%, rgba(201,168,76,0.12) 0%, transparent 60%);
      pointer-events: none;
    }

    /* ── Main stage ── */
    .stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.5rem;
      z-index: 1;
    }

    /* ── SVG loader ── */
    .loader-svg {
      width: 200px;
      height: 200px;
      overflow: visible;
    }

    /* ── Outer mandala ring — slow clockwise ── */
    @keyframes spin-cw  { to { transform: rotate(360deg);  } }
    @keyframes spin-ccw { to { transform: rotate(-360deg); } }
    @keyframes flame-breathe {
      0%,100% { transform: scale(1)   translateY(0);    opacity: 0.90; }
      50%      { transform: scale(1.08) translateY(-2px); opacity: 1;    }
    }
    @keyframes spark-rise {
      0%   { opacity: 0;   transform: translate(0, 0) scale(1);   }
      20%  { opacity: 0.9; }
      100% { opacity: 0;   transform: translate(var(--sx), -38px) scale(0.3); }
    }
    @keyframes ring-pulse {
      0%,100% { opacity: 0.35; r: 72; }
      50%      { opacity: 0.65; r: 76; }
    }
    @keyframes dot-pulse {
      0%,80%,100% { transform: scale(0.6); opacity: 0.35; }
      40%          { transform: scale(1.0); opacity: 1;    }
    }
    @keyframes gold-shimmer {
      0%   { stop-color: #E8C56A; }
      50%  { stop-color: #C9A84C; }
      100% { stop-color: #E8C56A; }
    }
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0);   }
    }

    .mandala-outer { transform-origin: 100px 100px; animation: spin-cw  14s linear infinite; }
    .mandala-mid   { transform-origin: 100px 100px; animation: spin-ccw  9s linear infinite; }
    .mandala-inner { transform-origin: 100px 100px; animation: spin-cw   6s linear infinite; }
    .flame-group   { transform-origin: 100px 100px; animation: flame-breathe 2.2s ease-in-out infinite; }

    .spark { animation: spark-rise 1.8s ease-out infinite; }
    .spark:nth-child(1) { --sx: -6px;  animation-delay: 0.0s; }
    .spark:nth-child(2) { --sx:  4px;  animation-delay: 0.4s; }
    .spark:nth-child(3) { --sx: -2px;  animation-delay: 0.8s; }
    .spark:nth-child(4) { --sx:  8px;  animation-delay: 1.2s; }
    .spark:nth-child(5) { --sx: -8px;  animation-delay: 1.6s; }

    /* ── Text block ── */
    .text-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.375rem;
      animation: fade-in 0.9s 0.4s both ease-out;
    }
    .brand-name {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 2.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1;
      background: linear-gradient(140deg, var(--ink) 0%, var(--purple) 50%, var(--gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .brand-sub {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: 0.95rem;
      color: var(--gold);
      letter-spacing: 0.06em;
      opacity: 0.85;
    }

    /* ── Gold shimmer divider ── */
    .divider {
      width: 6rem;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold) 50%, transparent);
      opacity: 0.5;
    }

    /* ── Loading dots ── */
    .dots {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold);
      animation: dot-pulse 1.4s ease-in-out infinite;
    }
    .dot:nth-child(1) { animation-delay: 0.0s; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    .loading-label {
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="stage">

    <!-- ── SVG Loader ── -->
    <svg class="loader-svg" viewBox="0 0 200 200" fill="none"
         xmlns="http://www.w3.org/2000/svg"
         role="img" aria-label="Vivah loading">
      <defs>
        <!-- Agni flame gradient: gold tip → purple body → deep purple base -->
        <linearGradient id="agni" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#E8C56A"/>
          <stop offset="40%"  stop-color="#C9A84C"/>
          <stop offset="75%"  stop-color="#7C3AED"/>
          <stop offset="100%" stop-color="#4F1FB5"/>
        </linearGradient>

        <!-- Inner flame highlight -->
        <linearGradient id="agni-hi" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#FAFAF8" stop-opacity="0.9"/>
          <stop offset="100%" stop-color="#E8C56A" stop-opacity="0.2"/>
        </linearGradient>

        <!-- Gold petal gradient -->
        <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#E8C56A"/>
          <stop offset="100%" stop-color="#C9A84C"/>
        </linearGradient>

        <!-- Purple petal (inner ring) -->
        <linearGradient id="petal-p" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#A78BFA"/>
          <stop offset="100%" stop-color="#7C3AED"/>
        </linearGradient>

        <!-- Saffron spark -->
        <radialGradient id="spark-grad" cx="50%" cy="50%" r="50%">
          <stop offset="0%"   stop-color="#E8C56A"/>
          <stop offset="100%" stop-color="#E2813F" stop-opacity="0"/>
        </radialGradient>

        <!-- Glow filter for flame -->
        <filter id="flame-glow" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="4" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>

        <!-- Soft drop shadow for mandala -->
        <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="1" stdDeviation="2"
                        flood-color="#7C3AED" flood-opacity="0.25"/>
        </filter>
      </defs>

      <!-- ═══ Layer 1: Outer pulsing ring ═══ -->
      <circle cx="100" cy="100" r="72"
              stroke="#C9A84C" stroke-width="0.8"
              stroke-dasharray="4 8"
              fill="none" opacity="0.30">
        <animate attributeName="stroke-dashoffset"
                 from="0" to="-60" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity"
                 values="0.30;0.55;0.30" dur="3s" repeatCount="indefinite"/>
      </circle>

      <!-- ═══ Layer 2: 8-petal outer mandala ring ═══ -->
      <g class="mandala-outer" filter="url(#soft-shadow)">
        <!-- 8 gold petals at r=62 -->
        <ellipse cx="100" cy="38"  rx="5" ry="12" fill="url(#petal)" opacity="0.60"/>
        <ellipse cx="100" cy="38"  rx="5" ry="12" fill="url(#petal)" opacity="0.60" transform="rotate(45 100 100)"/>
        <ellipse cx="100" cy="38"  rx="5" ry="12" fill="url(#petal)" opacity="0.60" transform="rotate(90 100 100)"/>
        <ellipse cx="100" cy="38"  rx="5" ry="12" fill="url(#petal)" opacity="0.60" transform="rotate(135 100 100)"/>
        <ellipse cx="100" cy="38"  rx="5" ry="12" fill="url(#petal)" opacity="0.60" transform="rotate(180 100 100)"/>
        <ellipse cx="100" cy="38"  rx="5" ry="12" fill="url(#petal)" opacity="0.60" transform="rotate(225 100 100)"/>
        <ellipse cx="100" cy="38"  rx="5" ry="12" fill="url(#petal)" opacity="0.60" transform="rotate(270 100 100)"/>
        <ellipse cx="100" cy="38"  rx="5" ry="12" fill="url(#petal)" opacity="0.60" transform="rotate(315 100 100)"/>
        <!-- 8 small dots between petals -->
        <circle cx="100" cy="44"  r="2.2" fill="#C9A84C" opacity="0.45"/>
        <circle cx="100" cy="44"  r="2.2" fill="#C9A84C" opacity="0.45" transform="rotate(45 100 100)"/>
        <circle cx="100" cy="44"  r="2.2" fill="#C9A84C" opacity="0.45" transform="rotate(90 100 100)"/>
        <circle cx="100" cy="44"  r="2.2" fill="#C9A84C" opacity="0.45" transform="rotate(135 100 100)"/>
        <circle cx="100" cy="44"  r="2.2" fill="#C9A84C" opacity="0.45" transform="rotate(180 100 100)"/>
        <circle cx="100" cy="44"  r="2.2" fill="#C9A84C" opacity="0.45" transform="rotate(225 100 100)"/>
        <circle cx="100" cy="44"  r="2.2" fill="#C9A84C" opacity="0.45" transform="rotate(270 100 100)"/>
        <circle cx="100" cy="44"  r="2.2" fill="#C9A84C" opacity="0.45" transform="rotate(315 100 100)"/>
      </g>

      <!-- ═══ Layer 3: Mid dashed ring — counter-rotating ═══ -->
      <g class="mandala-mid">
        <circle cx="100" cy="100" r="56"
                stroke="#7C3AED" stroke-width="1"
                stroke-dasharray="3 6"
                fill="none" opacity="0.22"/>
      </g>

      <!-- ═══ Layer 4: Inner 6-petal lotus (purple) ═══ -->
      <g class="mandala-inner">
        <ellipse cx="100" cy="68" rx="3.5" ry="9" fill="url(#petal-p)" opacity="0.50"/>
        <ellipse cx="100" cy="68" rx="3.5" ry="9" fill="url(#petal-p)" opacity="0.50" transform="rotate(60 100 100)"/>
        <ellipse cx="100" cy="68" rx="3.5" ry="9" fill="url(#petal-p)" opacity="0.50" transform="rotate(120 100 100)"/>
        <ellipse cx="100" cy="68" rx="3.5" ry="9" fill="url(#petal-p)" opacity="0.50" transform="rotate(180 100 100)"/>
        <ellipse cx="100" cy="68" rx="3.5" ry="9" fill="url(#petal-p)" opacity="0.50" transform="rotate(240 100 100)"/>
        <ellipse cx="100" cy="68" rx="3.5" ry="9" fill="url(#petal-p)" opacity="0.50" transform="rotate(300 100 100)"/>
      </g>

      <!-- ═══ Layer 5: Centre disc ═══ -->
      <circle cx="100" cy="100" r="32" fill="#FAFAF8" opacity="0.97"/>
      <circle cx="100" cy="100" r="32" fill="none" stroke="#C9A84C" stroke-width="0.8" opacity="0.35"/>

      <!-- ═══ Layer 6: Lotus base petals (static, decorative) ═══ -->
      <path d="M 84 112 Q 88 104 100 112 Q 112 104 116 112 Q 108 118 100 120 Q 92 118 84 112Z"
            fill="#C9A84C" opacity="0.20"/>

      <!-- ═══ Layer 7: Sparks rising from flame tip ═══ -->
      <g transform="translate(100, 82)">
        <circle class="spark" cx="-3"  cy="0" r="2.2" fill="url(#spark-grad)"/>
        <circle class="spark" cx="4"   cy="0" r="1.8" fill="url(#spark-grad)"/>
        <circle class="spark" cx="-1"  cy="0" r="1.5" fill="url(#spark-grad)"/>
        <circle class="spark" cx="7"   cy="0" r="1.2" fill="url(#spark-grad)"/>
        <circle class="spark" cx="-6"  cy="0" r="1.0" fill="url(#spark-grad)"/>
      </g>

      <!-- ═══ Layer 8: Agni flame ═══ -->
      <g class="flame-group" filter="url(#flame-glow)">
        <!-- Outer flame body -->
        <path d="
          M 100 80
          C 106 88,  118 96,  114 108
          C 110 118, 104 122,  100 122
          C  96 122,  90 118,  86 108
          C  82 96,   94 88,  100 80 Z
        " fill="url(#agni)"/>

        <!-- Inner flame highlight -->
        <path d="
          M 100 86
          C 104 92,  112 98,  109 108
          C 107 114, 103 117,  100 117
          C  97 117,  93 114,  91 108
          C  88 98,   96 92,  100 86 Z
        " fill="url(#agni-hi)" opacity="0.35"/>

        <!-- Flame tip sparkle -->
        <circle cx="100" cy="83" r="2.5" fill="#E8C56A" opacity="0.70">
          <animate attributeName="opacity"
                   values="0.70;1;0.70" dur="1.2s" repeatCount="indefinite"/>
          <animate attributeName="r"
                   values="2.5;3.2;2.5" dur="1.2s" repeatCount="indefinite"/>
        </circle>
      </g>

      <!-- ═══ Layer 9: Centre Om glyph ═══ -->
      <text x="100" y="107"
            font-family="'Segoe UI', Arial, sans-serif"
            font-size="11"
            font-weight="600"
            text-anchor="middle"
            fill="#FAFAF8"
            opacity="0.85">ॐ</text>

      <!-- ═══ Layer 10: Outer ornament dots (corner accents) ═══ -->
      <circle cx="100" cy="22" r="2.5" fill="#C9A84C" opacity="0.50"/>
      <circle cx="178" cy="100" r="2.5" fill="#C9A84C" opacity="0.50"/>
      <circle cx="100" cy="178" r="2.5" fill="#C9A84C" opacity="0.50"/>
      <circle cx="22"  cy="100" r="2.5" fill="#C9A84C" opacity="0.50"/>
    </svg>

    <!-- ── Text block ── -->
    <div class="text-block">
      <span class="brand-name">Vivah</span>
      <span class="brand-sub">शुभ विवाह — Auspicious Union</span>
      <div class="divider" style="margin: 0.5rem 0;"></div>
      <div class="dots" aria-label="Loading" role="status">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
      <span class="loading-label">Preparing your wedding</span>
    </div>

  </div>
</body>
</html>
