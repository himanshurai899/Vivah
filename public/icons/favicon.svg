<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="Vivah">
  <defs>
    <linearGradient id="agni" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#C9A84C"/>
      <stop offset="55%"  stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4F1FB5"/>
    </linearGradient>
    <linearGradient id="ringGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#E8C56A"/>
      <stop offset="100%" stop-color="#C9A84C"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FAFAF8"/>
      <stop offset="100%" stop-color="#F0ECF8"/>
    </radialGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#bg)"/>
  <circle cx="16" cy="16" r="15" fill="none" stroke="url(#ringGold)" stroke-width="1"/>

  <!-- 8-petal mandala ring -->
  <g transform="translate(16,16)">
    <ellipse cx="0" cy="-11" rx="2" ry="4" fill="url(#ringGold)" opacity="0.45" transform="rotate(0)"/>
    <ellipse cx="0" cy="-11" rx="2" ry="4" fill="url(#ringGold)" opacity="0.45" transform="rotate(45)"/>
    <ellipse cx="0" cy="-11" rx="2" ry="4" fill="url(#ringGold)" opacity="0.45" transform="rotate(90)"/>
    <ellipse cx="0" cy="-11" rx="2" ry="4" fill="url(#ringGold)" opacity="0.45" transform="rotate(135)"/>
    <ellipse cx="0" cy="-11" rx="2" ry="4" fill="url(#ringGold)" opacity="0.45" transform="rotate(180)"/>
    <ellipse cx="0" cy="-11" rx="2" ry="4" fill="url(#ringGold)" opacity="0.45" transform="rotate(225)"/>
    <ellipse cx="0" cy="-11" rx="2" ry="4" fill="url(#ringGold)" opacity="0.45" transform="rotate(270)"/>
    <ellipse cx="0" cy="-11" rx="2" ry="4" fill="url(#ringGold)" opacity="0.45" transform="rotate(315)"/>

    <!-- Inner bg disc -->
    <circle r="8.5" fill="#FAFAF8" opacity="0.96"/>

    <!-- Lotus base -->
    <path d="M-5 3.5 Q-2.5 -0.5 0 3.5 Q2.5 -0.5 5 3.5 Q2.5 5.5 0 6.5 Q-2.5 5.5 -5 3.5Z" fill="#C9A84C" opacity="0.28"/>

    <!-- Agni flame -->
    <path d="M0 -7 C2 -3.5, 4.5 0, 3 3.5 C1 6.5, -1 6.5, -3 3.5 C-4.5 0, -2 -3.5, 0 -7Z" fill="url(#agni)"/>

    <!-- Inner flame highlight -->
    <path d="M0 -4.5 C1 -2.5, 2.2 0, 1.4 2 C0.5 4, -0.5 4, -1.4 2 C-2.2 0, -1 -2.5, 0 -4.5Z" fill="#E8C56A" opacity="0.32"/>

    <!-- Centre spark -->
    <circle r="1" fill="#FAFAF8" opacity="0.92"/>
  </g>
</svg>
