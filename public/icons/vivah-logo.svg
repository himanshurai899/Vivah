<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 56" fill="none" role="img" aria-label="Vivah">
  <defs>
    <!-- Agni flame gradient: purple → gold -->
    <linearGradient id="agni" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#C9A84C"/>
      <stop offset="55%"  stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4F1FB5"/>
    </linearGradient>
    <!-- Outer ring gold -->
    <linearGradient id="ringGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#E8C56A"/>
      <stop offset="100%" stop-color="#C9A84C"/>
    </linearGradient>
    <!-- Text gradient -->
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0F0612"/>
      <stop offset="60%"  stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#C9A84C"/>
    </linearGradient>
  </defs>

  <!-- ── Icon mark (28×28, centred at 14,28) ── -->
  <!-- Outer mandala ring — 8 gold petals -->
  <g transform="translate(28,28)">
    <!-- Petals (rotated 45° each) -->
    <ellipse cx="0" cy="-12" rx="2.2" ry="4.5" fill="url(#ringGold)" opacity="0.55" transform="rotate(0)"/>
    <ellipse cx="0" cy="-12" rx="2.2" ry="4.5" fill="url(#ringGold)" opacity="0.55" transform="rotate(45)"/>
    <ellipse cx="0" cy="-12" rx="2.2" ry="4.5" fill="url(#ringGold)" opacity="0.55" transform="rotate(90)"/>
    <ellipse cx="0" cy="-12" rx="2.2" ry="4.5" fill="url(#ringGold)" opacity="0.55" transform="rotate(135)"/>
    <ellipse cx="0" cy="-12" rx="2.2" ry="4.5" fill="url(#ringGold)" opacity="0.55" transform="rotate(180)"/>
    <ellipse cx="0" cy="-12" rx="2.2" ry="4.5" fill="url(#ringGold)" opacity="0.55" transform="rotate(225)"/>
    <ellipse cx="0" cy="-12" rx="2.2" ry="4.5" fill="url(#ringGold)" opacity="0.55" transform="rotate(270)"/>
    <ellipse cx="0" cy="-12" rx="2.2" ry="4.5" fill="url(#ringGold)" opacity="0.55" transform="rotate(315)"/>

    <!-- Inner circle bg -->
    <circle r="10" fill="#FAFAF8" opacity="0.95"/>
    <circle r="10" fill="none" stroke="url(#ringGold)" stroke-width="0.8" opacity="0.6"/>

    <!-- Lotus base: 3 rounded petals at bottom -->
    <path d="M-6 4 Q-3 -1 0 4 Q3 -1 6 4 Q3 6 0 7 Q-3 6 -6 4Z" fill="#C9A84C" opacity="0.30"/>

    <!-- Flame body — Agni -->
    <path d="
      M 0 -8
      C  2 -4,  5  0,  3  4
      C  1  7, -1  7, -3  4
      C -5  0, -2 -4,  0 -8 Z
    " fill="url(#agni)"/>

    <!-- Inner flame highlight -->
    <path d="
      M 0 -5
      C  1 -3,  2.5 0,  1.5 2.5
      C  0.5 4.5, -0.5 4.5, -1.5 2.5
      C -2.5 0, -1 -3,  0 -5 Z
    " fill="#E8C56A" opacity="0.35"/>

    <!-- Centre dot -->
    <circle r="1.2" fill="#FAFAF8" opacity="0.90"/>
  </g>

  <!-- ── Wordmark ── -->
  <!-- "Vivah" in Cormorant Garamond feel — using geometric letterforms -->
  <text
    x="63" y="35"
    font-family="'Cormorant Garamond', 'Georgia', serif"
    font-size="22"
    font-weight="600"
    letter-spacing="-0.3"
    fill="url(#textGrad)"
  >Vivah</text>

  <!-- Gold hairline under wordmark -->
  <line x1="63" y1="39" x2="138" y2="39" stroke="#C9A84C" stroke-width="0.7" opacity="0.45"/>

  <!-- Tagline -->
  <text
    x="63" y="49"
    font-family="'DM Sans', system-ui, sans-serif"
    font-size="7.5"
    font-weight="500"
    letter-spacing="1.8"
    fill="#5B4A6E"
    opacity="0.75"
  >WEDDING PLATFORM</text>
</svg>
